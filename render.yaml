# Render Blueprint: free web service using the native Python runtime (no Docker).
# Database (Neon) is an external free tier; fill the `sync: false` values in the dashboard.
services:
  - type: web
    name: ai-api-gateway
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh deploy/start.sh
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: USE_REDIS
        value: "false"
      - key: REDIS_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: OPENAI_API_KEYS
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
